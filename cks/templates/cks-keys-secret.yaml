{{- if and (not .Values.externalAppSecrets) (ne .Values.appConfig.keyProviderType "hsm") }}
# ---------------------------------------------------------------------------
# cks-keys secret — Helm-managed RSA keypair (default file mode only).
#
# Gated off when:
#   - externalAppSecrets is set (external secrets operator owns the secret), OR
#   - keyProviderType is "hsm" (setup-secrets.sh owns cks-keys out-of-band).
#
# In HSM mode, setup-secrets.sh creates cks-keys from the public key exported
# from the HSM by key reference. If this template were to render in HSM mode,
# helm upgrade would overwrite that secret with the placeholder value from
# values.yaml, breaking key resolution at rewrap time.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.appSecrets.virtruKeys.name }}
type: Opaque
{{- with .Values.appSecrets.virtruKeys.data }}
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
