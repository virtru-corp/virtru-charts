apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cks.fullname" . }}
  labels:
    {{- include "cks.labels" . | nindent 4 }}
data:
  # Auth Token Storage
  AUTH_TOKEN_STORAGE_TYPE: {{ default "in-memory" .Values.appConfig.authTokenStoreageType }}
  AUTH_TOKEN_STORAGE_IN_MEMORY_ENCODING: {{ default "base64" .Values.appConfig.authTokenStoreageMemoryEncoding }}

  # Logging
  LOG_RSYSLOG_ENABLED: "{{ default false .Values.appConfig.logRsyslogEnabled }}"
  LOG_CONSOLE_ENABLED: "{{ default true .Values.appConfig.logConsoleEnabled }}"

  # Server
  PORT: "{{ .Values.deployment.port }}"

  # ---------------------------------------------------------------------------
  # Boot Checker / Key Import
  #
  # HSM mode:     noKeysRule=hsm tells CKS keys live in the HSM at startup.
  #               Private key path is intentionally empty — the private key
  #               never leaves the hardware. Public key path points to the
  #               mounted rsa001.pub exported from the HSM (cks-keys secret).
  #
  # Default mode: noKeysRule=importPEM imports the keypair from mounted PEM files.
  #               Both paths resolve to Kubernetes secret mount locations.
  # ---------------------------------------------------------------------------
  {{- if eq .Values.appConfig.keyProviderType "hsm" }}
  BOOT_CHECKER_NOKEYS_RULE: hsm
  BOOT_CHECKER_IMPORT_PUBLIC_KEY_PATH: {{ default "/app/keys/rsa001.pub" .Values.appConfig.publicKeyPath }}
  BOOT_CHECKER_IMPORT_PRIVATE_KEY_PATH: ""
  {{- else }}
  BOOT_CHECKER_NOKEYS_RULE: {{ default "importPEM" .Values.appConfig.noKeysRule }}
  BOOT_CHECKER_IMPORT_PUBLIC_KEY_PATH: {{ default "/run/secrets/rsa001.pub" .Values.appConfig.publicKeyPath }}
  BOOT_CHECKER_IMPORT_PRIVATE_KEY_PATH: {{ default "/run/secrets/rsa001.pem" .Values.appConfig.privateKeyPath }}
  {{- end }}

  # Key Provider
  KEY_PROVIDER_PATH: {{ default "/app/keys" .Values.appSecrets.virtruKeys.mountPath }}
  KEY_PROVIDER_TYPE: {{ default "file" .Values.appConfig.keyProviderType }}

  # Authentication
  HMAC_AUTH_ENABLED: "{{ default true .Values.appConfig.hmacAuthEnabled }}"
  JWT_AUTH_ENABLED: "{{ default true .Values.appConfig.jwtAuthEnabled }}"
  JWT_AUTH_ISSUER: {{ default "https://api.virtru.com" .Values.appConfig.jwtAuthIssuer }}
  JWT_AUTH_JWKS_PATH: {{ default "/acm/api/jwks" .Values.appConfig.jwtAuthJwksPath }}
  JWT_AUTH_AUDIENCE: {{ .Values.appConfig.virtruOrgId }}

  # ---------------------------------------------------------------------------
  # KAS Configuration
  # Only rendered when CKS is deployed alongside KAS (DSP mode).
  # Non-KAS (standalone) installs can leave these as defaults.
  # ---------------------------------------------------------------------------
  KAS_AUTH_ISSUER: {{ .Values.appConfig.kasAuthIssuer }}
  KAS_AUTH_AUDIENCE: {{ .Values.appConfig.kasAuthAudience }}
  KAS_PUBLIC_HOSTNAME: {{ .Values.appConfig.kasPublicHostName }}

  # Database
  DSP_DB_DATABASE: {{ .Values.appConfig.dspDBDatabase }}
  DSP_DB_USER: {{ .Values.appConfig.dspDBUser }}

  # KAS Logging Configuration
  KAS_LOG_LEVEL: {{ default "info" .Values.appConfig.kasLogLevel }}
  KAS_LOG_TYPE: {{ default "json" .Values.appConfig.kasLogType }}
  KAS_LOG_OUTPUT: {{ default "stdout" .Values.appConfig.kasLogOutput }}

  # Platform Endpoints
  ACM_ENDPOINT: {{ default "https://api.virtru.com/acm/api" .Values.appConfig.acmEndpoint }}
  DATA_HARBOR_ENDPOINT: {{ default "https://api.virtru.com/data-harbor/api" .Values.appConfig.secureDataHarborEndpoint }}

  # Organization Configuration
  ORG_ID: {{ .Values.appConfig.virtruOrgId }}

  # KAS Identity
  KAS_URI: {{ .Values.appConfig.kasUri }}

  # Metadata directory (writable emptyDir in k8s, falls back to key dir for on-prem Docker)
  KAS_METADATA_DIR: {{ default "/app/data" .Values.appConfig.kasMetadataDir }}

  # Key Management Configuration
  # ---------------------------------------------------------------------------
  # KEY_ID is the KAS key ID provisioned by Virtru during DSP org provisioning.
  # Only required when KAS is enabled. If not using KAS, the default is safe
  # to leave as-is. If using KAS, contact Virtru support for your provisioned
  # UUID — it cannot be chosen or supplied by the user.
  # ---------------------------------------------------------------------------
  KEY_ID: {{ default "rsa1" .Values.appConfig.keyId | quote }}
  KAS_PUBLIC_KEY_FILE: {{ default "/app/keys/rsa001.pub" .Values.appConfig.kasPublicKeyFile }}
  KAS_PRIVATE_KEY_FILE: {{ default "/app/keys/rsa001.pem" .Values.appConfig.kasPrivateKeyFile }}
  KEY_ALGORITHM: {{ default "rsa:2048" .Values.appConfig.keyAlgorithm }}
  WRAPPING_KEY_ID: {{ default "kas-root-key" .Values.appConfig.wrappingKeyId }}

  # Optional/Utility
  DEBUG: {{ default "false" .Values.appConfig.debug | quote }}

  # ---------------------------------------------------------------------------
  # HSM / PKCS#11 Configuration (AWS CloudHSM SDK v5)
  #
  # Only rendered when appConfig.keyProviderType is "hsm". No HSM vars are
  # injected into non-HSM deployments — the else branch above is byte-identical
  # to the original file, so existing installs are unaffected.
  #
  # PKCS11_VENDOR must be "custom" for CloudHSM SDK v5. The value "CloudHSM"
  # is the SDK v3 / legacy vendor string — using it on an SDK v5 cluster causes
  # C_Initialize to fail or silently fall back to the wrong slot.
  #
  # PKCS11_LIB_NAME is separate from PKCS11_VENDOR. The library name stays
  # "CloudHSM" regardless of SDK version — this is the name the PKCS#11
  # interface registers itself under, not the vendor selector.
  #
  # PKCS11_SLOT_LBL / PKCS11_KEY_LBL use the abbreviated _LBL suffix.
  # The longer forms _SLOT_LABEL / _KEY_LABEL are not recognized and cause
  # a silent fallback to the default slot label "HSMV4".
  # ---------------------------------------------------------------------------
  {{- if eq .Values.appConfig.keyProviderType "hsm" }}
  CRYPTO_OPERATIONS_TYPE: {{ default "hsm" .Values.appConfig.cryptoOperationsType }}
  HSM_IP: {{ .Values.appConfig.hsmIp | quote }}
  HSM_IP2: {{ .Values.appConfig.hsmIp2 | quote }}
  PKCS11_VENDOR: {{ default "custom" .Values.appConfig.pkcs11Vendor }}
  PKCS11_LIB_NAME: {{ default "CloudHSM" .Values.appConfig.pkcs11LibName }}
  PKCS11_LIB_PATH: {{ default "/opt/cloudhsm/lib/libcloudhsm_pkcs11.so" .Values.appConfig.pkcs11LibPath }}
  PKCS11_SLOT_LBL: {{ .Values.appConfig.pkcs11SlotLbl | quote }}
  PKCS11_KEY_LBL: {{ .Values.appConfig.pkcs11KeyLbl | quote }}
  {{- end }}