apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cks.fullname" . }}
  labels:
    {{- include "cks.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: 600
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "cks.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cks.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cks.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # -- HSM Init Container: runs configure-pkcs11 before CKS starts
      # Copies the mounted cloudhsm-pkcs11.cfg into a writable emptyDir,
      # then runs configure-pkcs11 to initialize the PKCS#11 slot.
      initContainers:
        - name: configure-pkcs11
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "Copying cloudhsm-pkcs11.cfg to writable location..."
              cp /opt/cloudhsm/etc/cloudhsm-pkcs11-ro/cloudhsm-pkcs11.cfg /opt/cloudhsm/etc/cloudhsm-pkcs11.cfg
              echo "Running configure-pkcs11..."
              /opt/cloudhsm/bin/configure-pkcs11 \
                -a {{ .Values.appConfig.hsmIp }} {{ .Values.appConfig.hsmIp2 }} \
                --hsm-ca-cert /opt/cloudhsm/etc/customerCA.crt \
                --log-type term \
                --log-level info
              echo "configure-pkcs11 complete."
          volumeMounts:
            # Writable emptyDir where the final config lives
            - mountPath: /opt/cloudhsm/etc
              name: cloudhsm-etc
            # Read-only source config mounted at a different path
            - mountPath: /opt/cloudhsm/etc/cloudhsm-pkcs11-ro/cloudhsm-pkcs11.cfg
              name: cloudhsm-pkcs11-cfg
              subPath: cloudhsm-pkcs11.cfg
              readOnly: true
            # CA cert needed by configure-pkcs11
            - mountPath: /opt/cloudhsm/etc/cloudhsm-pkcs11-ro/customerCA.crt
              name: hsm-ca-cert
              subPath: customerCA.crt
              readOnly: true
      containers:
        - name: {{ .Chart.Name }}
          envFrom:
          - configMapRef:
              name: {{ include "cks.fullname" . }}
          {{- if not .Values.externalAppSecrets }}
          - secretRef:
              name: {{ .Values.appSecrets.virtruAuth.name }}
          {{- end }}
          {{- if .Values.externalAppSecrets }}
          {{ range .Values.externalAppSecrets }}
          - secretRef:
              name: {{ .secretsPath }}
          {{- end }}
          {{- end }}
          {{- if not .Values.externalAppSecrets }}
          env:
          # -- HSM: Inject PKCS11_PIN from hsm-pin secret
          - name: PKCS11_PIN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.appSecrets.hsmPin.name }}
                key: pkcs11Pin
          {{- end }}
          {{- if .Values.externalAppSecrets }}
          {{- with index .Values.externalAppSecrets 0 }}
          env:
          - name: AUTH_TOKEN_STORAGE_IN_MEMORY_TOKEN_JSON
            valueFrom:
              secretKeyRef:
                key: hmac-auth-token-json
                name: {{ .secretsPath }}
                optional: true
          - name: PKCS11_PIN
            valueFrom:
              secretKeyRef:
                name: {{ $.Values.appSecrets.hsmPin.name }}
                key: pkcs11Pin
          {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.deployment.port }}
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: {{ .Values.deployment.port }}
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if not .Values.externalAppSecrets }}
          volumeMounts:
          - mountPath: "/app/keys"
            name: {{ .Values.appSecrets.virtruKeys.name }}
            readOnly: true
          - mountPath: "/app/data"
            name: app-data
          # -- HSM: Writable etc dir initialized by init container
          - mountPath: /opt/cloudhsm/etc
            name: cloudhsm-etc
          # -- HSM: Mount customerCA.crt into the writable etc dir
          - mountPath: /opt/cloudhsm/etc/customerCA.crt
            name: hsm-ca-cert
            subPath: customerCA.crt
            readOnly: true
          # -- HSM: Mount client TLS cert and key
          - mountPath: /opt/cloudhsm/etc/client.crt
            name: cloudhsm-client-tls
            subPath: client.crt
            readOnly: true
          - mountPath: /opt/cloudhsm/etc/client.key
            name: cloudhsm-client-key
            subPath: client.key
            readOnly: true
          {{- end }}
          {{- if .Values.externalAppSecrets }}
          {{- with index .Values.externalAppSecrets 0 }}
          volumeMounts:
          - mountPath: "/app/keys"
            name: {{ .name }}
            readOnly: true
          - mountPath: "/app/data"
            name: app-data
          # -- HSM: Writable etc dir initialized by init container
          - mountPath: /opt/cloudhsm/etc
            name: cloudhsm-etc
          # -- HSM: Mount customerCA.crt into the writable etc dir
          - mountPath: /opt/cloudhsm/etc/customerCA.crt
            name: hsm-ca-cert
            subPath: customerCA.crt
            readOnly: true
          # -- HSM: Mount client TLS cert and key
          - mountPath: /opt/cloudhsm/etc/client.crt
            name: cloudhsm-client-tls
            subPath: client.crt
            readOnly: true
          - mountPath: /opt/cloudhsm/etc/client.key
            name: cloudhsm-client-key
            subPath: client.key
            readOnly: true
          {{- end }}
          {{- end }}
      {{- if not .Values.externalAppSecrets }}
      volumes:
      - name: {{ .Values.appSecrets.virtruKeys.name }}
        secret:
          defaultMode: 420
          secretName: {{ .Values.appSecrets.virtruKeys.name }}
      - name: app-data
        emptyDir: {}
      # -- HSM: Writable emptyDir for /opt/cloudhsm/etc — populated by init container
      - name: cloudhsm-etc
        emptyDir: {}
      # -- HSM: CA Certificate secret
      - name: hsm-ca-cert
        secret:
          secretName: hsm-ca-cert
          items:
            - key: customerCA.crt
              path: customerCA.crt
      # -- HSM: PKCS11 config — read-only source, copied by init container
      - name: cloudhsm-pkcs11-cfg
        configMap:
          name: cloudhsm-pkcs11-cfg
          items:
            - key: cloudhsm-pkcs11.cfg
              path: cloudhsm-pkcs11.cfg
      # -- HSM: Client TLS cert
      - name: cloudhsm-client-tls
        secret:
          secretName: cloudhsm-client-tls
          items:
            - key: client.crt
              path: client.crt
      # -- HSM: Client TLS key
      - name: cloudhsm-client-key
        secret:
          secretName: cloudhsm-client-tls
          items:
            - key: client.key
              path: client.key
      {{- end }}
      {{- if .Values.externalAppSecrets }}
      {{- with index .Values.externalAppSecrets 0 }}
      volumes:
      - name: {{ .name }}
        secret:
          defaultMode: 420
          secretName: {{ .secretsPath }}
      - name: app-data
        emptyDir: {}
      # -- HSM: Writable emptyDir for /opt/cloudhsm/etc — populated by init container
      - name: cloudhsm-etc
        emptyDir: {}
      # -- HSM: CA Certificate secret
      - name: hsm-ca-cert
        secret:
          secretName: hsm-ca-cert
          items:
            - key: customerCA.crt
              path: customerCA.crt
      # -- HSM: PKCS11 config — read-only source, copied by init container
      - name: cloudhsm-pkcs11-cfg
        configMap:
          name: cloudhsm-pkcs11-cfg
          items:
            - key: cloudhsm-pkcs11.cfg
              path: cloudhsm-pkcs11.cfg
      # -- HSM: Client TLS cert
      - name: cloudhsm-client-tls
        secret:
          secretName: cloudhsm-client-tls
          items:
            - key: client.crt
              path: client.crt
      # -- HSM: Client TLS key
      - name: cloudhsm-client-key
        secret:
          secretName: cloudhsm-client-tls
          items:
            - key: client.key
              path: client.key
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}