{{- if .Values.externalAppSecrets }}
{{ range .Values.externalAppSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretsPath }}
  labels:
    {{- include "cks.labels" $ | nindent 4 }}
spec:
  dataFrom:
  - extract:
      key: {{ required "secretsPath is required" .secretsPath }}
  target:
    name: {{ .secretsPath }}
    {{- with .excludeKeys }}
    {{- $keys := list }}
    {{- range . }}
    {{- $keys = append $keys (quote .) }}
    {{- end }}
    template:
      engineVersion: v2
      mergePolicy: Replace
      templateFrom:
        - target: Data
          literal: {{ printf "{{- $data := dict -}}{{- range $key, $value := . -}}{{- $_ := set $data $key $value -}}{{- end -}}{{ omit $data %s | toYaml }}" (join " " $keys) | quote }}
    {{- end }}
  secretStoreRef:
    kind: {{ .secretStoreRef.kind }}
    name: {{ .secretStoreRef.name }}
  refreshInterval: {{ .refreshInterval | default "1h" }}
{{- end }}
{{- end }}
