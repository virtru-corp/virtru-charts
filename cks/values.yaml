#
#   kubectl create configmap cloudhsm-client-cfg \
#     --from-file=cloudhsm_client.cfg=cloudhsm_client.cfg -n <namespace>
#
# NOTE: The deployment.yaml template applies these volumes directly.
#       This section documents what is mounted and why.
# ==============================================================================

